# bind -n C-\ run "(tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\/)vim$' && tmux send-keys 'C-\\') || tmux select-pane -l"
# bind C-l send-keys 'C-l'

# bind-key C-o rotate-window

bind-key + select-layout main-horizontal
bind-key = select-layout even-horizontal
set-window-option -g other-pane-height 25
set-window-option -g other-pane-width 80

# bind-key a last-pane
# bind-key q display-panes
# bind-key c new-window
# bind-key t next-window
# bind-key T previous-window

# Mark window unread (toggle)
bind-key u set-option -F -w @unread "#{?@unread,0,1}"
bind-key C-u set-option -F -w @unread "#{?@unread,0,1}"
set-hook -g session-window-changed 'set-option -u -w @unread'

# bind-key [ copy-mode
# bind-key ] paste-buffer

# Clipboard integration via OSC 52
# Allows applications inside tmux (such as Vim) and tmux copy-mode to sync with
# the outer terminal's clipboard (e.g. iTerm2, Chrome Secure Shell, Alacritty)
# both locally and over remote SSH sessions (remote workstations, Linux VMs, etc.).
set -s set-clipboard on

# Allow escape sequence passthrough (required in tmux 3.3+ for iTerm2 inline
# images / OSC 1337 file transfers, hyperlinks, etc.)
set -g allow-passthrough on

# Setup 'v' to begin selection as in Vim and 'y' to copy to clipboard
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "tmux load-buffer -w -"
unbind-key -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "tmux load-buffer -w -"

# set-window-option -g display-panes-time 1500

# Status Bar
set-option -g status-interval 1
set-option -g status-left-length 55
set-option -g status-right-length 80
set-option -g status-left '#([ -x ~/.local/bin/tmux-status-fit ] && ~/.local/bin/tmux-status-fit #{client_name})#[fg=colour241][#{?#{m/r:^[0-9]+$,#S},,#S }#{USER}@#H] '

# Right-hand widgets + clock. Rendered via T: (format + strftime) so it can be
# placed on row 0 (one row) or right-aligned on row 1 (two rows).
set-option -g @status-right-body '#([ -x ~/.tmux-status-right ] && ~/.tmux-status-right)#([ -x ~/.local/bin/ttl-widget ] && ~/.local/bin/ttl-widget tmux)#[fg=colour241]%Y-%m-%dT%H:%M:%S %Z'
set-option -g status-right '#{?#{==:#{status},on},#{T:@status-right-body},}'
set-option -g status-format[1] '#[align=right]#{T:@status-right-body}'

# Wrap onto a second status row when one row would overflow (tmux/status-fit).
# status-left also runs it as an empty #() job (throttled to 5s) to catch
# window renames and widgets changing width.
set-hook -g client-attached[10] 'run-shell -b "[ -x ~/.local/bin/tmux-status-fit ] && ~/.local/bin/tmux-status-fit #{client_name} --now"'
set-hook -g client-resized[10]  'run-shell -b "[ -x ~/.local/bin/tmux-status-fit ] && ~/.local/bin/tmux-status-fit #{client_name} --now"'
set-hook -g window-linked[10]   'run-shell -b "[ -x ~/.local/bin/tmux-status-fit ] && ~/.local/bin/tmux-status-fit #{client_name} --now"'
set-hook -g window-unlinked[10] 'run-shell -b "[ -x ~/.local/bin/tmux-status-fit ] && ~/.local/bin/tmux-status-fit #{client_name} --now"'
set-window-option -g window-status-current-style bg=magenta,fg=black,bold
set-window-option -g window-status-current-format ' #I:#W#{?@busy, ✻,}#{?window_bell_flag, ♫,} '
set-window-option -g window-status-format ' #I:#W#{?@busy, ✻,}#{?window_bell_flag, ♫,} '
set-window-option -g window-status-activity-style fg=colour166
set-window-option -g window-status-bell-style fg=colour136,bold
set-window-option -g window-status-style "#{?@busy,fg=colour166,#{?@unread,fg=colour136,fg=colour244}}"
#set-window-option -g window-status-current-fg-style magenta

# Status Bar solarized-dark (default)
set-option -g status-style bg=black,fg=default
set-option -g pane-active-border-style fg=black
#set-option -g pane-active-border-fg black
set-option -g pane-border-style fg=black
#set-option -g pane-border-fg-style black

# Show pane titles on the top border of each pane
set-option -g pane-border-status top

# `:rename-pane <name>` mirrors `:rename-window <name>` (sets the pane title).
# Fixed index keeps re-sourcing idempotent and avoids clobbering default aliases.
set-option -s command-alias[100] rename-pane='select-pane -T'

# Status Bar solarized-light
if-shell "[ \"$COLORFGBG\" = \"11;15\" ]" "set-option -g status-style bg=white"
if-shell "[ \"$COLORFGBG\" = \"11;15\" ]" "set-option -g pane-active-border-style fg=white"
if-shell "[ \"$COLORFGBG\" = \"11;15\" ]" "set-option -g pane-border-style fg=white"

# Set window notifications
setw -g monitor-activity off
set -g visual-activity off

# Enable native Mac OS X copy/paste
# set-option -g default-command "/bin/bash -c 'which reattach-to-user-namespace >/dev/null && exec reattach-to-user-namespace $SHELL -l || exec $SHELL -l'"

# Allow the arrow key to be used immediately after changing windows
set-option -g repeat-time 0

# Fix to allow mousewheel/trackpad scrolling in tmux 2.1
bind-key -T root WheelUpPane if-shell -F -t = "#{alternate_on}" "send-keys -M" "select-pane -t =; copy-mode -e; send-keys -M"
bind-key -T root WheelDownPane if-shell -F -t = "#{alternate_on}" "send-keys -M" "select-pane -t =; send-keys -M"

# Disable assume-paste-time, so that iTerm2's "Send Hex Codes" feature works
# with tmux 2.1. This is backwards-compatible with earlier versions of tmux,
# AFAICT.
set-option -g assume-paste-time 0

# I don't know what this does. Claude code suggested it?
set -g focus-events on

# Refresh selected env vars on every `tmux attach`, so a freshly
# attached client overwrites the tmux session's stale copies. Most
# important here is SSH_AUTH_SOCK: the macOS launchd ssh-agent socket
# path rotates per login, and without this, panes spawned in an
# already-running session inherit whatever value was current when the
# server first started -- often empty or pointing at a dead socket.
# DISPLAY/SSH_CONNECTION/TERM are along for the ride for similar
# reasons. See zsh/.zshrc for the matching socket-recovery logic.
set -g update-environment "SSH_AUTH_SOCK SSH_CONNECTION DISPLAY TERM"
